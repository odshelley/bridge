# 200-step smoke test for the Poisson bridge on CIFAR-10.
# Tiny model, small batch — verifies the end-to-end pipeline, not sample quality.

name: poisson_cifar10_smoke
output_dir: ./outputs/cifar10_poisson_smoke
method: poisson_bridge

model:
  in_channels: 3
  out_channels: 3
  sample_size: 32
  block_out_channels: [32, 32]
  layers_per_block: 1
  down_block_types:
    - DownBlock2D
    - AttnDownBlock2D
  up_block_types:
    - AttnUpBlock2D
    - UpBlock2D
  attention_head_dim: 4
  dropout: 0.0

training:
  batch_size: 16
  num_steps: 200
  learning_rate: 0.0002
  weight_decay: 0.0
  grad_clip_norm: 1.0
  checkpoint_every: 200
  log_every: 50
  seed: 42
  use_ema: true
  ema_decay: 0.9999

poisson_bridge:
  T: 1.0
  eps: 1.0e-7
  num_levels: 256
  prior: zeros
  prior_lambda: 1.0

bridge:
  T: 0.1
  eps: 1.0e-7

sampling:
  num_steps: 20
  num_samples: 16
  show_progress: true
  clip_samples: false

data:
  dataset: cifar10
  data_dir: ./data
  image_size: 32
  num_workers: 0         # 0 = main process only (avoids pickle issues on macOS MPS)
  pin_memory: false      # pin_memory not supported on MPS
  raw_pixels: true
