# Smoke test for CIFAR cat -> dog transport: minutes on MPS/CPU.
# Verifies the full pipeline (paired loading, transport training, checkpointing),
# not sample quality.

name: bridge_cifar_cat2dog_smoke
output_dir: ./outputs/cifar_cat2dog_smoke
method: bridge

model:
  in_channels: 3
  out_channels: 3
  sample_size: 32
  block_out_channels: [64, 128]
  layers_per_block: 1
  down_block_types:
    - DownBlock2D
    - AttnDownBlock2D
  up_block_types:
    - AttnUpBlock2D
    - UpBlock2D
  attention_head_dim: 8
  dropout: 0.0

training:
  batch_size: 16
  num_steps: 200
  learning_rate: 0.0002
  weight_decay: 0.0
  grad_clip_norm: 1.0
  checkpoint_every: 100
  log_every: 50
  seed: 42
  use_ema: false

bridge:
  T: 0.1
  eps: 0.0000001

sampling:
  num_steps: 20
  num_samples: 16
  show_progress: true
  clip_samples: true

data:
  dataset: cifar10
  classes: [dog]
  source_dataset: cifar10
  source_classes: [cat]
  data_dir: ./data
  image_size: 32
  num_workers: 2
  pin_memory: false
