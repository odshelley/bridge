# AFHQ generation (all classes) at 64x64 with the Poisson bridge.
# Operates on raw integer pixel counts [0, 255]; prior is a blank (zeros) image.
# Requires: bash scripts/download_afhq.sh

name: poisson_afhq_64
output_dir: ./outputs/afhq_poisson_64
method: poisson_bridge

model:
  in_channels: 3
  out_channels: 3
  sample_size: 64
  block_out_channels: [128, 256, 384, 512]
  layers_per_block: 2
  down_block_types:
    - DownBlock2D
    - DownBlock2D
    - AttnDownBlock2D
    - AttnDownBlock2D
  up_block_types:
    - AttnUpBlock2D
    - AttnUpBlock2D
    - UpBlock2D
    - UpBlock2D
  attention_head_dim: 8
  dropout: 0.1

training:
  batch_size: 64
  num_steps: 150000
  learning_rate: 0.0001
  weight_decay: 0.0
  grad_clip_norm: 1.0
  checkpoint_every: 10000
  log_every: 100
  seed: 42
  use_ema: true
  ema_decay: 0.9999

poisson_bridge:
  T: 1.0
  eps: 1.0e-7
  num_levels: 256        # raw 8-bit pixel values [0, 255]
  prior: zeros           # prior is a blank image (all zeros)
  prior_lambda: 1.0

bridge:
  T: 0.1
  eps: 1.0e-7

sampling:
  num_steps: 100
  num_samples: 64
  show_progress: true
  clip_samples: false    # Poisson output does not need clipping

data:
  dataset: afhq
  data_dir: ./data
  image_size: 64
  num_workers: 8
  pin_memory: true
  raw_pixels: true       # keep pixel values as integers in [0, 255]
